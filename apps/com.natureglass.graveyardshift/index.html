<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0d12">
<title>Graveyard Shift</title>
<style>
:root{--bg:#090a0f;--panel:#12141c;--panel2:#191c27;--text:#f4f1e8;--muted:#a7a5ad;--accent:#8ee05f;--danger:#ef5f61;--gold:#ffd35a;--cyan:#6bd7ff;--cell:#242733;--cell2:#303342;--shadow:0 12px 40px #0008}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% 0,#202329 0,#090a0f 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:12px clamp(10px,2vw,24px) 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:29px}.title{font-weight:900;letter-spacing:.08em;font-size:clamp(18px,3vw,26px);text-transform:uppercase}.sub{color:var(--muted);font-size:11px;letter-spacing:.13em}.mode{display:flex;gap:6px;background:#0006;padding:5px;border-radius:12px}.mode button,.smallbtn{background:#20232d;border:1px solid #ffffff12;border-radius:9px;padding:8px 12px;font-size:12px}.mode .active{background:var(--accent);color:#10150d;font-weight:800}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 0 12px}.stat{background:#10121a;border:1px solid #ffffff12;border-radius:12px;padding:8px 12px}.stat.right{text-align:right}.label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.value{font-weight:900;font-variant-numeric:tabular-nums;font-size:19px}.round{font-size:13px;font-weight:800;text-align:center;white-space:nowrap}.timer{color:var(--accent)}.board-wrap{position:relative;display:flex;justify-content:center;align-items:center;flex:1;min-height:0}.board{width:min(82vh,82vw,650px);aspect-ratio:1;display:grid;gap:clamp(7px,1.2vw,13px);touch-action:none}.grave{position:relative;min-width:0;border-radius:24%;background:linear-gradient(145deg,var(--cell2),var(--cell));box-shadow:inset 0 2px 0 #fff0a,0 7px 18px #0008;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}.grave:after{content:"";position:absolute;left:13%;right:13%;bottom:12%;height:27%;background:#090a0f;border-radius:50%;box-shadow:0 -3px 5px #0008 inset}.grave:active{transform:scale(.97)}.head{position:absolute;z-index:2;left:50%;bottom:17%;transform:translate(-50%,0) scale(.15);opacity:0;width:55%;aspect-ratio:1;border-radius:50% 50% 45% 45%;background:#71885b;box-shadow:inset -5px -5px 0 #4d6041,0 8px 10px #0008;transition:transform .12s ease,opacity .12s}.head:before,.head:after{content:"";position:absolute;width:13%;height:16%;background:#0b0b0e;border-radius:50%;top:37%}.head:before{left:28%}.head:after{right:28%}.zombie .head{transform:translate(-50%,0) scale(1);opacity:1}.zombie.golden .head{background:linear-gradient(145deg,#ffe681,#d7a72e);box-shadow:inset -5px -5px 0 #b47e15,0 0 20px #ffd34c66}.zombie.helmet .head{background:#70866a}.helmet-cap{position:absolute;z-index:3;left:50%;bottom:57%;transform:translateX(-50%);width:52%;height:17%;background:#6d7783;border-radius:60% 60% 15% 15%;box-shadow:0 3px 0 #3f4750;opacity:0;transition:opacity .08s}.zombie.helmet .helmet-cap{opacity:1}.zombie.helmet.cracked .helmet-cap{opacity:0}.survivor .head{background:#d59b73}.survivor .head:before,.survivor .head:after{background:#202530}.survivor .head{box-shadow:inset -5px -5px 0 #a36f52,0 8px 10px #0008}.pop-label{position:absolute;z-index:4;top:7%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(9px,1.7vw,15px);opacity:0}.zombie .pop-label{opacity:1}.golden .pop-label{color:var(--gold)}.survivor .pop-label{color:var(--danger)}.hitflash{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:24%;background:#fff;opacity:0}.grave.hit .hitflash{animation:flash .14s ease-out}@keyframes flash{0%{opacity:.8}100%{opacity:0}}.combo{position:absolute;top:8%;left:50%;transform:translateX(-50%) translateY(5px);font-size:clamp(13px,2vw,20px);font-weight:1000;color:var(--accent);opacity:0;pointer-events:none;text-shadow:0 2px 8px #000}.combo.show{animation:combo .45s ease-out}@keyframes combo{0%{opacity:1;transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(1)}}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:11px}.legend{display:flex;gap:10px;flex-wrap:wrap}.dot{display:inline-flex;align-items:center;gap:4px}.dot i{width:8px;height:8px;border-radius:50%;display:inline-block;background:#71885b}.dot.gold i{background:var(--gold)}.dot.bad i{background:var(--danger)}.overlay{position:absolute;inset:0;display:none;place-items:center;background:#06070bcc;z-index:20;padding:20px}.overlay.show{display:grid}.card{width:min(480px,94vw);background:linear-gradient(180deg,#1a1d28,#10121a);border:1px solid #ffffff18;border-radius:20px;padding:24px;box-shadow:var(--shadow);text-align:center}.card h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px)}.card p{color:var(--muted);line-height:1.5}.bigscore{font-size:44px;font-weight:1000;margin:12px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.primary{background:var(--accent);color:#0d1309;font-weight:900;border-radius:10px;padding:11px 18px}.secondary{background:#272a35;border-radius:10px;padding:11px 18px}.breather{position:absolute;z-index:10;top:10px;left:50%;transform:translateX(-50%);background:#11131bbb;backdrop-filter:blur(8px);border:1px solid #ffffff18;padding:8px 14px;border-radius:999px;display:none;text-align:center}.breather.show{display:block}.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#11131e;color:var(--text);padding:8px 12px;border-radius:999px;border:1px solid #ffffff18;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.net{font-size:10px;padding:4px 7px;border-radius:99px;background:#242733}.net.online{color:var(--accent)}.net.offline{color:var(--muted)}@media(max-width:600px){.app{padding-top:6px}.top{min-height:48px}.mode button{padding:6px 8px}.hud{margin-bottom:8px}.stat{padding:6px 9px}.value{font-size:16px}.board{width:min(94vw,72vh);gap:7px}.grave{border-radius:20%}.footer{font-size:9px}.legend{gap:7px}.sub{display:none}}@media(min-width:800px){.board.tv{width:min(76vh,720px)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">⚰️</div><div><div class="title">Graveyard Shift</div><div class="sub">Same-board zombie whacking</div></div></div><div class="mode"><button id="soloBtn" class="active">Solo</button><button id="relayBtn">Relay</button></div></header>
<section class="hud"><div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div><div class="round">ROUND <span id="round">1</span> · <span id="timer" class="timer">30.0</span>s</div><div class="stat right"><span class="label">Combo</span><span id="comboValue" class="value">x1</span></div></section>
<main class="board-wrap"><div id="board" class="board"></div><div id="breather" class="breather">Round complete · next round in <b id="breakTimer">5</b></div><div id="overlay" class="overlay"><div class="card"><h1 id="endTitle">Night survived!</h1><p id="endText">You cleared the graveyard.</p><div id="bigScore" class="bigscore">0</div><div class="actions"><button id="again" class="primary">Play again</button><button id="switchMode" class="secondary">Switch mode</button></div></div></div></main>
<footer class="footer"><div class="legend"><span class="dot"><i></i> Zombie 10</span><span class="dot gold"><i></i> Golden 50</span><span class="dot bad"><i></i> Survivor −25</span></div><div><span id="net" class="net offline">SOLO</span> <span id="relayInfo"></span></div></footer>
<div id="toast" class="toast"></div>
</div>
<script>
'use strict';
const RELAY_URL='wss://ws.brewswer.io';
const CONFIG={roundMs:30000,breakMs:5000,baseSpawn:680,minSpawn:180,baseLife:1050,minLife:390,goldenChance:.055,survivorChance:.075};
const $=s=>document.querySelector(s); const board=$('#board');
let mode='solo',gridSize=3,round=1,score=0,combo=0,roundHits=0,roundMisses=0,roundTimer=null,spawnTimer=null,breakTimer=null,roundEndAt=0,seed=0,rng=null,active=new Map(),running=false,ws=null,room=null,playerId=null,host=false,claimed=new Set(),lastInput=0;
function fmt(n){return Math.max(0,Math.round(n)).toLocaleString()}
function mul(){return 1+Math.min(4,Math.floor(combo/5))}
function updateHud(){$('#score').textContent=fmt(score);$('#round').textContent=round;$('#comboValue').textContent='x'+mul();$('#timer').textContent=Math.max(0,(roundEndAt-performance.now())/1000).toFixed(1)}
function makeBoard(){gridSize=innerWidth>=760?4:3; board.classList.toggle('tv',gridSize===4); board.style.gridTemplateColumns=`repeat(${gridSize},1fr)`;board.innerHTML='';for(let i=0;i<gridSize*gridSize;i++){const g=document.createElement('button');g.className='grave';g.dataset.i=i;g.setAttribute('aria-label','Grave '+(i+1));g.innerHTML='<span class="head"></span><span class="helmet-cap"></span><span class="pop-label"></span><span class="hitflash"></span><span class="combo"></span>';g.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)});board.appendChild(g)}}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hashSeed(a){a|=0;a=Math.imul(a^a>>>16,0x45d9f3b);a=Math.imul(a^a>>>16,0x45d9f3b);return (a^a>>>16)>>>0}
function scheduleSeed(r){return hashSeed(seed+r*0x9e3779b9)}
function spawnDelay(){const difficulty=Math.min(1,(round-1)/10);return CONFIG.baseSpawn-(CONFIG.baseSpawn-CONFIG.minSpawn)*difficulty}
function lifeMs(){const difficulty=Math.min(1,(round-1)/10);return CONFIG.baseLife-(CONFIG.baseLife-CONFIG.minLife)*difficulty}
function nextType(r){const x=r();if(x<CONFIG.survivorChance)return'survivor';if(x<CONFIG.survivorChance+CONFIG.goldenChance)return'golden';if(x<.28)return'helmet';return'zombie'}
function spawnAt(index,type,token,life){if(active.has(index))return;const el=board.children[index];if(!el)return;el.className='grave '+type;el.querySelector('.pop-label').textContent=type==='survivor'?'DON\'T!':type==='golden'?'+50':type==='helmet'?'2 HITS':'+10';active.set(index,{type,hp:type==='helmet'?2:1,token});const timer=setTimeout(()=>vanish(index,token),life);active.get(index).timer=timer}
function vanish(index,token){const a=active.get(index);if(!a||a.token!==token)return;active.delete(index);board.children[index].className='grave';miss(false)}
function miss(remote=false){if(!running)return;roundMisses++;combo=0;updateHud();if(!remote)showToast('MISS — combo reset')}
function hit(index){if(!running||performance.now()-lastInput<35)return;lastInput=performance.now();const a=active.get(index);if(!a){miss();return}if(mode==='relay'&&!claimed.has(a.token)){sendClaim(a.token,index,performance.now()-roundStartAt)}if(mode==='relay'&&a.remoteOnly)return;resolveHit(index,a)}
function resolveHit(index,a){if(!active.has(index))return;const el=board.children[index];el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),140);if(a.type==='survivor'){score=Math.max(0,score-25);combo=0;roundMisses++;active.delete(index);clearTimeout(a.timer);el.className='grave';showToast('SURVIVOR! −25 · combo lost');updateHud();return}if(a.type==='helmet'&&a.hp===2){a.hp=1;el.classList.add('cracked');a.timer=setTimeout(()=>vanish(index,a.token),Math.max(220,lifeMs()/2));showToast('Helmet knocked off!');return}active.delete(index);clearTimeout(a.timer);const pts=a.type==='golden'?50:10;combo++;roundHits++;score+=pts*mul();const c=el.querySelector('.combo');c.textContent='+'+(pts*mul());c.classList.remove('show');void c.offsetWidth;c.classList.add('show');el.className='grave';updateHud()}
let roundStartAt=0;
function startRound(){running=true;roundStartAt=performance.now();roundEndAt=roundStartAt+CONFIG.roundMs;rng=mulberry32(scheduleSeed(round));claimed.clear();updateHud();scheduleSpawn();clearInterval(roundTimer);roundTimer=setInterval(()=>{updateHud();if(performance.now()>=roundEndAt)endRound()},50)}
function scheduleSpawn(){if(!running)return;const delay=spawnDelay()*(.72+rng()*.58);spawnTimer=setTimeout(()=>{const free=[];for(let i=0;i<gridSize*gridSize;i++)if(!active.has(i))free.push(i);if(free.length){const idx=free[Math.floor(rng()*free.length)];const type=nextType(rng);const token=`${round}:${Math.floor((performance.now()-roundStartAt)/10)}:${idx}:${Math.floor(rng()*1e6)}`;spawnAt(idx,type,token,lifeMs()*(.8+rng()*.35));if(mode==='relay')send({t:'spawn_hint',round,token,idx,type,at:performance.now()-roundStartAt})}scheduleSpawn()},delay)}
function endRound(){if(!running)return;running=false;clearTimeout(spawnTimer);clearInterval(roundTimer);for(const [i,a] of active){clearTimeout(a.timer);board.children[i].className='grave'}active.clear();$('#breakTimer').textContent='5';$('#breather').classList.add('show');let left=5;clearInterval(breakTimer);breakTimer=setInterval(()=>{left--;$('#breakTimer').textContent=left;if(left<=0){clearInterval(breakTimer);$('#breather').classList.remove('show');round++;roundHits=0;roundMisses=0;startRound()}},1000)}
function startGame(){stopRelay();score=0;combo=0;round=1;roundHits=0;roundMisses=0;seed=(crypto.getRandomValues(new Uint32Array(1))[0]);$('#overlay').classList.remove('show');$('#breather').classList.remove('show');startRound()}
function stopGame(){running=false;clearTimeout(spawnTimer);clearInterval(roundTimer);clearInterval(breakTimer);active.forEach(a=>clearTimeout(a.timer));active.clear()}
function finish(){stopGame();const best=Number(localStorage.getItem('graveyard_best')||0);if(score>best)localStorage.setItem('graveyard_best',String(score));$('#endTitle').textContent='Shift complete';$('#endText').textContent=`Best: ${fmt(Math.max(best,score))} · Hits: ${roundHits} · Misses: ${roundMisses}`;$('#bigScore').textContent=fmt(score);$('#overlay').classList.add('show')}
function showToast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),850)}
function send(o){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}
function sendClaim(token,index,t){send({t:'claim',room,player:playerId,token,grave:index,at:Math.round(t)})}
function connectRelay(){stopRelay();mode='relay';$('#soloBtn').classList.remove('active');$('#relayBtn').classList.add('active');$('#net').textContent='CONNECTING';$('#net').className='net';showToast('Connecting to Brewser Relay…');try{ws=new WebSocket(RELAY_URL);ws.onopen=()=>{playerId=crypto.randomUUID?crypto.randomUUID():String(Math.random());room=new URLSearchParams(location.search).get('room')||'graveyard-'+Math.random().toString(36).slice(2,7);send({t:'join',game:'graveyard-shift',room,player:playerId});$('#net').textContent='RELAY ONLINE';$('#net').className='net online';$('#relayInfo').textContent=room;showToast('Relay connected')};ws.onmessage=e=>relayMessage(e.data);ws.onclose=()=>{if(mode==='relay'){$('#net').textContent='RELAY OFFLINE';$('#net').className='net offline';showToast('Relay unavailable — continuing locally')}};ws.onerror=()=>{}; }catch(e){$('#net').textContent='LOCAL FALLBACK';$('#net').className='net offline'}}
function relayMessage(raw){let m;try{m=JSON.parse(raw)}catch{return}if(m.t==='welcome'){host=!!m.host;if(m.seed!=null){seed=Number(m.seed);round=Number(m.round||1);startGame()}}else if(m.t==='round_seed'){seed=Number(m.seed);round=Number(m.round||1)}else if(m.t==='claim_result'){const a=active.get(Number(m.grave));if(m.accepted){if(a&&a.token===m.token){if(m.player===playerId)resolveHit(Number(m.grave),a);else{active.delete(Number(m.grave));clearTimeout(a.timer);board.children[Number(m.grave)].className='grave'}}}else if(a&&a.token===m.token){if(m.player!==playerId){active.delete(Number(m.grave));clearTimeout(a.timer);board.children[Number(m.grave)].className='grave'}}}else if(m.t==='score'){/* scoreboard hook for relay UI */}}
function stopRelay(){if(ws){try{ws.close()}catch{}ws=null}room=null;host=false;$('#net').textContent=mode==='solo'?'SOLO':'OFFLINE';$('#net').className='net offline';$('#relayInfo').textContent=''}
function setMode(m){if(m===mode)return;mode=m;if(m==='relay')connectRelay();else{stopRelay();$('#soloBtn').classList.add('active');$('#relayBtn').classList.remove('active');startGame()}}
$('#soloBtn').onclick=()=>setMode('solo');$('#relayBtn').onclick=()=>setMode('relay');$('#again').onclick=startGame;$('#switchMode').onclick=()=>{$('#overlay').classList.remove('show');setMode(mode==='solo'?'relay':'solo')};addEventListener('resize',()=>{const old=gridSize;makeBoard();if(old!==gridSize&&running){active.clear();showToast(`${gridSize}×${gridSize} board`)}});makeBoard();startGame();
// Keyboard/gamepad-friendly input: number keys map directly to graves.
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9'){const i=Number(e.key)-1;if(i<board.children.length)hit(i)}if(e.key==='0'&&board.children.length>=10)hit(9);if(e.key==='Escape'&&running)finish()});
</script>
</body>
</html>
