  <!--
    TEMPORARY boot diagnostics for devices without DevTools (e.g. the Brewser console).
    Written in ES5 on purpose so it runs even where the Angular bundle can't.
    Prints errors on screen, and a browser feature report if the app hasn't started after 8s.
  -->
  <script>
    (function () {
      var box = null;
      var pending = [];

      function show(message) {
        var host = document.body;
        if (!host) {
          pending.push(message);
          return;
        }
        if (!box) {
          box = document.createElement('pre');
          box.setAttribute('role', 'log');
          box.style.cssText =
            'position:fixed;left:0;right:0;bottom:0;max-height:70%;overflow:auto;margin:0;' +
            'padding:8px;background:#fff;color:#000;font:14px/1.4 monospace;' +
            'white-space:pre-wrap;word-wrap:break-word;z-index:2147483647';
          host.appendChild(box);
          for (var i = 0; i < pending.length; i++) {
            box.appendChild(document.createTextNode(pending[i] + '\n'));
          }
          pending = [];
        }
        box.appendChild(document.createTextNode(message + '\n'));
      }

      function describe(value) {
        if (value && value.stack) return String(value.stack);
        if (value && value.message) return String(value.message);
        return String(value);
      }

      window.onerror = function (message, source, line, column, error) {
        show('[window.onerror] ' + message + '\n  at ' + source + ':' + line + ':' + column +
          (error ? '\n' + describe(error) : ''));
      };

      if (window.addEventListener) {
        window.addEventListener('unhandledrejection', function (event) {
          show('[unhandled promise] ' + describe(event.reason));
        });
        // Failed <script>/<link> loads (404s, blocked files) don't reach window.onerror.
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window && (target.src || target.href)) {
            show('[failed to load] ' + (target.src || target.href));
          }
        }, true);
      }

      // Angular reports bootstrap and runtime errors through console.error.
      if (window.console && console.error) {
        var originalError = console.error;
        console.error = function () {
          var parts = [];
          for (var i = 0; i < arguments.length; i++) parts.push(describe(arguments[i]));
          show('[console.error] ' + parts.join(' '));
          return originalError.apply(console, arguments);
        };
      }

      function supports(code) {
        try {
          new Function(code);
          return 'yes';
        } catch (e) {
          return 'NO';
        }
      }

      window.setTimeout(function () {
        var root = document.getElementsByTagName('app-root')[0];
        if (root && root.children.length > 0) return;

        var script = document.createElement('script');
        var evalAllowed = supports('return 1') === 'yes';

        show('App did not start after 8 seconds.');
        show('User agent: ' + navigator.userAgent);
        show('ES modules (type="module"): ' + ('noModule' in script ? 'yes' : 'NO'));
        show('Dynamic eval allowed (needed for the checks below): ' + (evalAllowed ? 'yes' : 'NO'));
        if (evalAllowed) {
          var checks = [
            ['let/const + arrow functions', 'let a = () => 1; const b = a();'],
            ['classes', 'class A {}'],
            ['async/await', 'async function f() { await 0; }'],
            ['object spread', 'var a = { ...{} };'],
            ['optional chaining', 'var a = null; a?.b;'],
            ['nullish coalescing', 'var a = null ?? 1;'],
            ['class fields', 'class A { x = 1; #y = 2; }'],
            ['class static blocks', 'class A { static {} }'],
            ['async iteration (for await)', 'async function f() { for await (var x of []) {} }']
          ];
          for (var i = 0; i < checks.length; i++) {
            show('  ' + checks[i][0] + ': ' + supports(checks[i][1]));
          }
        }
        show('Promise: ' + typeof window.Promise +
          ' | fetch: ' + typeof window.fetch +
          ' | Proxy: ' + typeof window.Proxy +
          ' | WeakRef: ' + typeof window.WeakRef +
          ' | queueMicrotask: ' + typeof window.queueMicrotask);
      }, 8000);
    })();
  </script>
