<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pokémon Showdown</title>
    <link rel="stylesheet" href="./styles.css" />
  
<!-- brewser-pwa:start -->
<link rel="manifest" href="pwa/app.webmanifest">
<meta name="theme-color" content="#5184ac">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<script src="pwa/brewser-pwa.js" defer></script>
<!-- brewser-pwa:end -->
</head>
  <body>
    <main id="app">
      <h1>Pokémon Showdown</h1>
      <p id="status">Desconectado</p>

      <div class="panel">
        <button id="connectBtn">Conectar como invitado</button>
        <button id="disconnectBtn">Desconectar</button>
      </div>

      <section id="lobby" hidden>
        <h2>Lobby</h2>
        <div id="userInfo"></div>
        <div id="chatLog"></div>
        <div class="chatInput">
          <input
            id="chatText"
            type="text"
            placeholder="Escribe un mensaje..."
          />
          <button id="sendChat">Enviar</button>
        </div>
      </section>

      <pre id="log"></pre>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
