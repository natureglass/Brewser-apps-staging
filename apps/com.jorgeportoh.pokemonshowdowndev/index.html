<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test C2</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">

<!-- brewser-pwa:start -->
<link rel="manifest" href="pwa/app.webmanifest">
<meta name="theme-color" content="#5184ac">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<script src="pwa/brewser-pwa.js" defer></script>
<!-- brewser-pwa:end -->
</head>
<body>
  <div style="color:#ffffff;background:#000000;">
  <p>TEST C2: Angular como un unico app.js + CSS de Tailwind</p>
  <p id="diag-appjs">app.js: NO SE EJECUTO</p>
  <p id="diag-app">Angular: esperando...</p>
  <pre id="diag-log"></pre>
  </div>
  <script>
    (function () {
      function log(message) {
        var el = document.getElementById('diag-log');
        if (el) el.appendChild(document.createTextNode(message + '\n'));
      }
      function describe(value) {
        if (value && value.stack) return String(value.stack);
        if (value && value.message) return String(value.message);
        return String(value);
      }
      window.onerror = function (message, source, line, column, error) {
        log('[error] ' + message + ' @ ' + source + ':' + line + ':' + column + (error ? '\n' + describe(error) : ''));
      };
      if (window.addEventListener) {
        window.addEventListener('unhandledrejection', function (event) {
          log('[promesa rechazada] ' + describe(event.reason));
        });
      }
      if (window.console && console.error) {
        var originalError = console.error;
        console.error = function () {
          var parts = [];
          for (var i = 0; i < arguments.length; i++) parts.push(describe(arguments[i]));
          log('[console.error] ' + parts.join(' '));
          return originalError.apply(console, arguments);
        };
      }
      window.setTimeout(function () {
        var root = document.getElementsByTagName('app-root')[0];
        var count = root && root.children ? root.children.length : 'sin app-root';
        var el = document.getElementById('diag-app');
        if (el) el.textContent = 'Angular: app-root tiene ' + count + ' hijos tras 8 s (0 = no renderizo)';
        log('URL: ' + window.location.href);
      }, 8000);
    })();
  </script>
  <app-root></app-root>
  <script src="app.js"></script>
</body>
</html>
