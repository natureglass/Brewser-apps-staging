<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brewser WebSocket test</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 20px; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .buttons { margin-bottom: 12px; }
  button { font: inherit; font-size: 20px; padding: 12px 28px; margin-right: 10px; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  #status { font-size: 18px; margin-bottom: 12px; }
  #status b { font-weight: normal; color: #555; }
  .on { color: #0a7d0a; font-weight: bold; }
  .off { color: #b00; font-weight: bold; }
  .wait { color: #a05a00; font-weight: bold; }
  #log {
    border: 1px solid #aaa; background: #fafafa;
    height: 480px; overflow-y: auto; padding: 8px;
    font: 13px/1.4 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  #log div { padding: 1px 0; border-bottom: 1px solid #eee; }
  .in { color: #103e8c; }
  .out { color: #0a6b0a; }
  .err { color: #b00; }
</style>
</head>
<body>

<h1>Brewser WebSocket test</h1>

<div class="buttons">
  <button id="btnConnect">Connect</button>
  <button id="btnHello" disabled>Send Hello</button>
  <button id="btnDisconnect" disabled>Disconnect</button>
</div>

<div id="status">
  <b>Status:</b> <span id="st" class="off">disconnected</span>
  &nbsp;&nbsp; <b>Client ID:</b> <span id="clientId">-</span>
  &nbsp;&nbsp; <b>Members:</b> <span id="members">-</span>
</div>

<div id="log"></div>

<script>
var URL_ = "wss://ws.brewser.io?app=ws-test&room=lobby";
var ws = null;

function log(cls, text) {
  var div = document.createElement("div");
  div.className = cls;
  div.textContent = new Date().toTimeString().slice(0, 8) + "  " + text;
  var el = document.getElementById("log");
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function setStatus(text, cls) {
  var el = document.getElementById("st");
  el.textContent = text;
  el.className = cls;
}

function setButtons(connected) {
  document.getElementById("btnConnect").disabled = connected;
  document.getElementById("btnHello").disabled = !connected;
  document.getElementById("btnDisconnect").disabled = !connected;
}

function connect() {
  log("", "connecting to " + URL_);
  setStatus("connecting...", "wait");
  ws = new WebSocket(URL_);

  ws.onopen = function () {
    log("", "socket open");
    setStatus("connected (waiting for joined)", "wait");
    setButtons(true);
  };

  ws.onmessage = function (ev) {
    log("in", "<- " + ev.data);
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }

    if (msg.channel === "system" && msg.op === "joined") {
      setStatus("joined room " + msg.room, "on");
      document.getElementById("clientId").textContent = msg.clientId;
      document.getElementById("members").textContent = msg.members;
    }
    if (msg.channel === "system" && msg.op === "welcome") {
      log("", "welcome received, negotiated capabilities: " + (msg.capabilities || []).join(", "));
    }
    if (msg.channel === "system" && msg.op === "presence") {
      document.getElementById("members").textContent = msg.members;
    }
  };

  ws.onclose = function (ev) {
    log("err", "closed: code " + ev.code + (ev.reason ? " reason " + ev.reason : ""));
    setStatus("disconnected", "off");
    setButtons(false);
    document.getElementById("clientId").textContent = "-";
    document.getElementById("members").textContent = "-";
    ws = null;
  };

  ws.onerror = function () {
    log("err", "socket error");
  };
}

function sendHello() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { log("err", "not connected"); return; }
  var msg = JSON.stringify({
    v: 1,
    channel: "system",
    op: "hello",
    id: "hello-1",
    data: {
      client: "ws-test/1.0",
      capabilities: ["acks", "sequence_numbers", "reconnect_hint"]
    }
  });
  ws.send(msg);
  log("out", "-> " + msg);
}

function disconnect() {
  if (ws) ws.close(1000, "user disconnect");
}

document.getElementById("btnConnect").onclick = connect;
document.getElementById("btnHello").onclick = sendHello;
document.getElementById("btnDisconnect").onclick = disconnect;

log("", "ready");
</script>
</body>
</html>
