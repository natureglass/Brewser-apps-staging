<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVR - The Watcher</title>
<style>
:root{
  /* palette lifted from dark.css */
  --bg:#0b1220; --bg-2:#0e1830; --bg-3:#14202d; --bg-4:#1f2c4d;
  --line:#28365c; --line-2:#3a4f7a; --line-3:#2a3a66;
  --ink:#e0e8f4; --ink-strong:#eaf2ff; --ink-2:#9bb1d6; --ink-3:#6a7c95;
  --yellow:#ffd35e; --blue:#7aa2ff; --green:#7eda9f; --orange:#ffb86b; --red:#ff8676;
  --danger-bg:#572c2c; --danger-line:#7a3338; --danger-ink:#ffb8b8;
  --font:Tahoma,"Segoe UI",Arial,Helvetica,sans-serif;
  --mono:ui-monospace,Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--ink);font:15px/1.45 var(--font);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:var(--green)}
h1,h2{margin:0}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

.top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg-2);position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:20px;color:var(--yellow);white-space:nowrap;line-height:1.12}
.brand small{font-weight:700;font-size:13px;color:var(--ink-2)}
.top .spacer{margin-left:auto}
.top .keys{font-size:12px;color:var(--ink-3)}
.top .keys kbd{font-family:var(--mono);color:#c2e0ff;background:var(--bg-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}

.btn{background:var(--bg-3);border:1px solid var(--line-2);color:var(--ink-strong);border-radius:999px;padding:7px 15px;cursor:pointer;line-height:1.2;white-space:nowrap;font-weight:700;font-size:13.5px;letter-spacing:.01em}
.btn:hover{background:var(--bg-4);border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:default;background:var(--bg-3);border-color:var(--line-2)}
.btn.primary{background:var(--yellow);color:var(--bg);border-color:var(--yellow)}
.btn.primary:hover{background:var(--green);border-color:var(--green)}
.btn.accent{border-color:var(--green);color:var(--green)}
.btn.accent:hover{background:var(--green);color:var(--bg)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.btn.danger:hover{background:#6b3535;border-color:var(--red)}
.btn.danger:disabled{background:var(--danger-bg);border-color:var(--danger-line)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line-2);color:var(--ink-strong);background:var(--bg-3)}
.btn.small{padding:5px 11px;font-size:12.5px}

.main{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
.app.nopanel .main{grid-template-columns:0 minmax(0,1fr)}
.side{border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:22px;overflow:hidden auto;scrollbar-width:none;min-height:0;background:var(--bg-2)}
.side::-webkit-scrollbar{display:none}
.app.nopanel .side{visibility:hidden;padding:0;border:0;overflow:hidden}
.view{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0;min-width:0;padding:12px 14px 10px}
h2{font-weight:700;font-size:15px;color:var(--blue);margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2)}
input,select{background:var(--bg-3);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;width:100%;min-width:0;color:var(--ink-strong)}
input::placeholder{color:var(--ink-3)}
select option,select optgroup{background:var(--bg-3);color:var(--ink)}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--green)}
button:focus-visible,summary:focus-visible,a:focus-visible,li:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>.field{flex:1}
details.adv summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:700;margin:2px 0 8px}
details.adv .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:13px;color:var(--ink-2);margin:6px 0 0;line-height:1.45}
.hint code{background:var(--bg-3);padding:0 4px;border-radius:4px;font-size:12px;font-family:var(--mono);color:#c2e0ff}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;background:var(--bg-3);border:1px solid var(--line);border-left:3px solid var(--line-2)}
.list li:hover{border-color:var(--line-2);border-left-color:var(--blue)}
.list li.active{border-left-color:var(--yellow);background:var(--bg-4)}
.list .meta{flex:1;min-width:0}
.list .meta b{display:block;font-weight:700;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .meta span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.list .x{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:3px;font-size:16px;line-height:1}
.list .x:hover{color:var(--red)}
.empty{color:var(--ink-2);font-size:13.5px;padding:12px 14px;cursor:default;background:var(--bg-3);border-left:3px solid var(--blue);border-radius:6px}

.stage{position:relative;background:#0a1220;min-height:0;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.stage.armed{border-color:var(--line-3)}
.stage:fullscreen{border:0;border-radius:0}
.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;user-select:none}
.stage.mode-video video{display:block}
.stage.mode-img img{display:block}
.hud{position:absolute;inset:14px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:2}
.stage.armed .hud{opacity:1}
.hud .c{position:absolute;width:22px;height:22px;border:2px solid var(--blue)}
.hud .c1{left:0;top:0;border-right:0;border-bottom:0}
.hud .c2{right:0;top:0;border-left:0;border-bottom:0}
.hud .c3{left:0;bottom:0;border-right:0;border-top:0}
.hud .c4{right:0;bottom:0;border-left:0;border-top:0}
.hud .pill{position:absolute;display:flex;gap:7px;align-items:center;background:rgba(11,18,32,.8);border:1px solid var(--line-2);padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink-strong)}
.hud .live{left:10px;bottom:10px;color:var(--ink-2)}
.hud .live i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.hud .live.on{color:var(--ink-strong)}
.hud .live.on i{background:var(--red);animation:blink 1.3s infinite}
.hud .ro{right:10px;bottom:10px;color:#c2e0ff;font-family:var(--mono);font-weight:500;font-size:12px}
.hud .nm{left:10px;top:10px;max-width:60%;overflow:hidden;text-overflow:ellipsis}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.hud .live.on i{animation:none}.hud{transition:none}}
.notice{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);text-align:center;padding:28px;font-size:15px;line-height:1.5;z-index:3}
.notice.hide{display:none}
.notice .box{max-width:520px}
.notice .box p{margin:0 0 10px}
.notice .eye{width:96px;height:56px;margin:0 auto 18px;display:block}
.notice .box .btn{pointer-events:auto}

.bar{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.now{flex:1 1 0;min-width:60px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--ink-2);font-family:var(--mono)}
.now b{color:var(--ink-strong);font-weight:700;font-family:var(--font);font-size:15px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--blue);font-family:var(--font);font-weight:700}
.stats{display:flex;gap:5px;flex:none}
.stat{display:flex;flex-direction:column;padding:4px 10px 3px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg-3);min-width:64px}
.stat b{font-weight:700;font-size:10.5px;color:var(--ink-2);line-height:1.2}
.stat span{font-family:var(--mono);font-size:13px;color:var(--ink-strong);white-space:nowrap;line-height:1.3}
.stat span.dim{color:var(--ink-3)}
.stat span.ok{color:var(--green)}
.stat span.err{color:var(--red)}
.stat span.warn{color:var(--orange)}
.controls{display:flex;gap:6px;flex:none}

@media (max-width:980px){
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .app.nopanel .main{grid-template-rows:0 minmax(0,1fr)}
  .side{max-height:44vh;border-right:0;border-bottom:1px solid var(--line)}
  .brand small{display:none}
  .stats{display:none}
  .top .keys{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand">NVR<small>The Watcher</small></h1>
    <button class="btn ghost small" id="btnPanel" type="button" title="Show or hide the side panel (h)">Panel</button>
    <span class="spacer"></span>
    <span class="keys"><kbd>h</kbd> panel &nbsp; <kbd>f</kbd> fullscreen &nbsp; <kbd>Esc</kbd> stop</span>
  </header>

  <div class="main">
    <aside class="side">
      <section>
        <h2>Open a camera</h2>
        <div class="field">
          <label for="url">Stream address</label>
          <input id="url" placeholder="http://192.168.1.80/video.mjpg or https://…/stream.m3u8" spellcheck="false" autocomplete="off">
        </div>
        <div class="row">
          <div class="field">
            <label for="type">Kind</label>
            <select id="type">
              <option value="auto">Auto-detect</option>
              <option value="hls">HLS (.m3u8)</option>
              <option value="mjpeg">MJPEG stream</option>
              <option value="whep">WebRTC (WHEP)</option>
              <option value="video">MP4 / WebM</option>
              <option value="snapshot">JPEG snapshot, refreshed</option>
            </select>
          </div>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" placeholder="Front door" autocomplete="off">
          </div>
        </div>
        <details class="adv">
          <summary>Options</summary>
          <div class="grid2">
            <div class="field"><label for="optInterval">Snapshot refresh (ms)</label><input id="optInterval" type="number" min="200" step="100" value="1000"></div>
          </div>
        </details>
        <div class="row">
          <button class="btn primary" id="btnPlay" type="button">Watch</button>
          <button class="btn" id="btnSave" type="button">Save</button>
          <button class="btn danger" id="btnClear" type="button" title="Reset every field to its default">Clear all</button>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="presets">Fill in a common address</label>
          <select id="presets">
            <option value="">Choose a camera type…</option>
            <optgroup label="Local cameras (HTTP)">
              <option value="http://192.168.1.90/axis-cgi/mjpg/video.cgi|mjpeg|Axis MJPEG">Axis MJPEG</option>
              <option value="http://192.168.1.80:81/stream|mjpeg|ESP32-CAM">ESP32-CAM stream</option>
              <option value="http://192.168.1.50:88/cgi-bin/CGIStream.cgi?cmd=GetMJStream&usr=user&pwd=pass|mjpeg|Foscam">Foscam MJPEG</option>
              <option value="http://192.168.1.90/axis-cgi/jpg/image.cgi|snapshot|Axis snapshot">Axis JPEG snapshot</option>
            </optgroup>
            <optgroup label="Gateways (turn RTSP cameras into WebRTC or HLS)">
              <option value="http://127.0.0.1:1984/api/webrtc?src=camera1|whep|go2rtc camera1">go2rtc (WebRTC)</option>
              <option value="http://127.0.0.1:8889/mystream/whep|whep|MediaMTX mystream">MediaMTX (WebRTC)</option>
              <option value="http://127.0.0.1:8888/mystream/index.m3u8|hls|MediaMTX HLS">MediaMTX (HLS)</option>
            </optgroup>
            <optgroup label="Test streams (not cameras)">
              <option value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8|hls|Mux test stream">HLS test stream</option>
              <option value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4|video|Big Buck Bunny">MP4 test file</option>
            </optgroup>
          </select>
        </div>
      </section>

      <section>
        <h2>Saved cameras</h2>
        <ul class="list" id="camList"></ul>
      </section>
    </aside>

    <main class="view">
      <div class="stage" id="stage">
        <video id="video" autoplay muted playsinline></video>
        <img id="img" alt="" draggable="false">
        <div class="hud">
          <span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span>
          <div class="pill nm" id="hudName"></div>
          <div class="pill live" id="hudLive"><i></i><span>Idle</span></div>
          <div class="pill ro" id="hudRo"></div>
        </div>
        <div class="notice" id="notice"><div class="box"></div></div>
      </div>

      <div class="bar">
        <div class="now" id="now">Nothing playing</div>
        <div class="stats" id="stats"></div>
        <div class="controls">
          <button class="btn accent" id="btnSaveNow" type="button" hidden>Save camera</button>
          <button class="btn" id="btnMute" type="button" hidden>Unmute</button>
          <button class="btn" id="btnShot" type="button" disabled>Snapshot</button>
          <button class="btn" id="btnFull" type="button" disabled>Fullscreen</button>
          <button class="btn danger" id="btnStop" type="button" disabled>Stop</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const HLS_SRCS = [
  'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.7.3/hls.min.js',
  'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
  'https://unpkg.com/hls.js@1/dist/hls.min.js'
];

// ---------- persistence (falls back to memory where storage is unavailable) ----------
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('watcher:' + k); return v === null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem('watcher:' + k, JSON.stringify(v)); } catch { mem[k] = v; } }
};
// carry over cameras saved by the previous version of this app
try {
  if (localStorage.getItem('watcher:cameras') === null && localStorage.getItem('periscope:cameras') !== null) {
    const old = JSON.parse(localStorage.getItem('periscope:cameras')) || [];
    store.set('cameras', old.filter(c => c && c.url));
  }
} catch { /* storage unavailable */ }
const settings = Object.assign({ panel: true }, store.get('settings', {}));
let cameras = store.get('cameras', []);

// ---------- small helpers ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtBytes(n) { if (n == null) return null; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i === 0 ? n : n.toFixed(n < 10 ? 2 : 1)) + ' ' + u[i]; }
function fmtKbps(k) { if (k == null) return null; return k >= 1000 ? (k / 1000).toFixed(2) + ' Mb/s' : Math.round(k) + ' kb/s'; }
function fmtDur(s) { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(x).padStart(2, '0'); }
function maskUrl(u) { try { const x = new URL(u); if (x.username || x.password) { x.password = x.password ? 'xxxx' : ''; } return x.href; } catch { return u; } }
function hasCreds(u) { try { const x = new URL(u); return !!(x.username || x.password); } catch { return false; } }
function bust(u) { return u + (u.includes('?') ? '&' : '?') + '_=' + Date.now(); }
function loadScript(urls) {
  if (window.Hls) return Promise.resolve(true);
  return urls.reduce((p, u) => p.then(ok => ok || new Promise(res => {
    const s = document.createElement('script'); s.src = u;
    s.onload = () => res(!!window.Hls); s.onerror = () => res(false);
    document.head.appendChild(s);
  })), Promise.resolve(false));
}
function newStats(protocol) {
  return { protocol, state: 'connecting', frames: 0, bytes: 0, dropped: 0, width: 0, height: 0, errors: 0, reconnects: 0, lastError: '', note: '', codec: null, buffer: null, latency: null, fps: undefined, bytesKnown: true, fpsKnown: true, extra: {} };
}

// ---------- stream kind detection ----------
function detectType(url) {
  const l = url.trim().toLowerCase();
  if (/^rtsps?:\/\//.test(l)) return 'rtsp';
  if (!/^https?:\/\//.test(l)) return 'invalid';
  if (/\.m3u8(\?|#|$)/.test(l)) return 'hls';
  if (/\/whep(\?|\/|$)|api\/webrtc|\/whep\b/.test(l)) return 'whep';
  if (/\.(mp4|m4v|webm|ogv|ogg|mov)(\?|#|$)/.test(l)) return 'video';
  if (/mjpe?g|mjpg|x-mixed|videostream\.cgi|video\.cgi|action=stream|nphmotionjpeg|\/stream(\?|$)|faststream|getmjstream/.test(l)) return 'mjpeg';
  if (/\.(jpe?g|png|gif|webp)(\?|#|$)|snapshot|snap\.cgi|image\.cgi|action=snapshot|\/jpg\/|\/capture(\?|$)|preview\.webp|preview\.jpg|\/frame(\?|$)/.test(l)) return 'snapshot';
  return 'guess';
}
async function probeType(url) {
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 5000);
  try {
    const res = await fetch(url, { signal: ac.signal, cache: 'no-store' });
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    ac.abort();
    if (ct.includes('multipart/x-mixed-replace')) return 'mjpeg';
    if (ct.includes('mpegurl')) return 'hls';
    if (ct.startsWith('image/')) return 'snapshot';
    if (ct.startsWith('video/') || ct.includes('mp4') || ct.includes('webm')) return 'video';
    if (ct.includes('text/html')) return 'html';
    return null;
  } catch { return null; } finally { clearTimeout(t); }
}

// ---------- JPEG frame scanner (works for multipart MJPEG and raw concatenated JPEGs) ----------
function findSOI(b, from) {
  for (let i = from; i + 2 < b.length; i++) if (b[i] === 0xff && b[i + 1] === 0xd8 && b[i + 2] === 0xff) return i;
  return -1;
}
// returns index past EOI, -1 if the frame is incomplete, -2 if the data is corrupt
function jpegEnd(b, start) {
  const n = b.length; let i = start + 2;
  while (i + 1 < n) {
    if (b[i] !== 0xff) { i++; continue; }
    const m = b[i + 1];
    if (m === 0xff) { i++; continue; }
    if (m === 0xd9) return i + 2;
    if (m === 0xd8 || m === 0x01 || (m >= 0xd0 && m <= 0xd7)) { i += 2; continue; }
    if (i + 3 >= n) return -1;
    const len = (b[i + 2] << 8) | b[i + 3];
    if (len < 2) return -2;
    i += 2 + len;
    if (m === 0xda) {
      while (i + 1 < n) {
        if (b[i] === 0xff) {
          const x = b[i + 1];
          if (x === 0x00 || (x >= 0xd0 && x <= 0xd7)) { i += 2; continue; }
          if (x === 0xff) { i++; continue; }
          break;
        }
        i++;
      }
    }
  }
  return -1;
}
function concatBytes(a, b) { if (!a.length) return b; const c = new Uint8Array(a.length + b.length); c.set(a); c.set(b, a.length); return c; }
// Reads a stream and calls onFrame(bytes) for every JPEG. Resolves 'single' if the URL was a plain JPEG, 'ended' when the stream closes.
async function readMjpeg(url, signal, onFrame, onOpen) {
  const res = await fetch(url, { signal, cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status + (res.statusText ? ' ' + res.statusText : ''));
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  onOpen && onOpen(ct);
  if (ct.startsWith('text/html')) throw new Error('The address returned a web page instead of a stream');
  if (ct.includes('mpegurl')) throw Object.assign(new Error('This is an HLS playlist'), { suggest: 'hls' });
  if (ct.startsWith('video/')) throw Object.assign(new Error('This is a video file'), { suggest: 'video' });
  if (ct.startsWith('image/') && !ct.includes('multipart')) {
    const buf = new Uint8Array(await res.arrayBuffer()); onFrame(buf); return 'single';
  }
  if (!res.body) throw new Error('Streaming responses are not supported in this browser');
  const reader = res.body.getReader();
  let buf = new Uint8Array(0);
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return 'ended';
    buf = concatBytes(buf, value);
    let pos = 0;
    for (;;) {
      const soi = findSOI(buf, pos);
      if (soi < 0) { pos = Math.max(pos, buf.length - 2); break; }
      const end = jpegEnd(buf, soi);
      if (end === -1) { pos = soi; break; }
      if (end === -2) { pos = soi + 2; continue; }
      onFrame(buf.subarray(soi, end)); pos = end;
    }
    if (pos > 0) buf = buf.slice(pos);
    if (buf.length > 32 * 1024 * 1024) buf = new Uint8Array(0);
  }
}

// ---------- stage elements ----------

// ---------- controller ----------

  const url = $('#url').value.trim();
  return {
    type: $('#type').value, url, name: $('#name').value.trim() || guessName(url),
    opts: { intervalMs: +$('#optInterval').value || 1000 }
  };
}
function guessName(url) { try { const u = new URL(url); return u.hostname + (u.pathname.length > 1 ? u.pathname.replace(/\/$/, '') : ''); } catch { return url; } }
$('#btnPlay').addEventListener('click', () => { const s = formSource(); if (!s.url) { $('#url').focus(); return; } play(s); });
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnPlay').click(); });
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnPlay').click(); });
$('#btnSave').addEventListener('click', () => { const s = formSource(); if (!s.url) { $('#url').focus(); return; } saveCamera(s); });
function clearForm() {
  $('#url').value = ''; $('#type').value = 'auto'; $('#name').value = ''; $('#presets').value = '';
  $('#optInterval').value = 1000;
  $('#url').focus();
}
$('#btnClear').addEventListener('click', clearForm);
$('#btnSaveNow').addEventListener('click', () => { if (current) { saveCamera(current.source); $('#btnSaveNow').hidden = true; } });
$('#presets').addEventListener('change', e => {
  const v = e.target.value; if (!v) return;
  const [url, type, name] = v.split('|');
  $('#url').value = url; $('#type').value = type; $('#name').value = name; e.target.value = '';
  $('#url').focus();
});
$('#btnStop').addEventListener('click', stop);
$('#btnFull').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen && stage.requestFullscreen().catch(() => {}); });
$('#btnMute').addEventListener('click', () => { video.muted = !video.muted; $('#btnMute').textContent = video.muted ? 'Unmute' : 'Mute'; });
$('#btnShot').addEventListener('click', () => {
  if (!current) return;
  const useVideo = stage.classList.contains('mode-video');
  const w = useVideo ? video.videoWidth : img.naturalWidth, h = useVideo ? video.videoHeight : img.naturalHeight;
  if (!w || !h) return;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  try {
    c.getContext('2d').drawImage(useVideo ? video : img, 0, 0);
    c.toBlob(b => {
      if (!b) return;
      const a = document.createElement('a'); a.href = URL.createObjectURL(b);
      a.download = ((current.source.name || 'camera').replace(/[^\w.-]+/g, '_')) + '_' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
  } catch (e) {
    notice('<p>The browser will not let the page copy frames from this stream, because the camera does not allow cross-origin access (CORS).</p>');
    setTimeout(hideNotice, 4000);
  }
});
function setPanel(on) { settings.panel = !!on; store.set('settings', settings); $('#app').classList.toggle('nopanel', !on); $('#btnPanel').setAttribute('aria-pressed', on ? 'true' : 'false'); }
$('#btnPanel').addEventListener('click', () => setPanel(!settings.panel));
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'f') $('#btnFull').click();
  if (e.key === 'h') setPanel(!settings.panel);
  if (e.key === 'Escape' && !document.fullscreenElement) stop();
});
window.addEventListener('beforeunload', () => { if (current) current.player.stop(); });

setPanel(settings.panel !== false);
renderList(); renderStats(null); notice(IDLE);
})();
</script>
</body>
