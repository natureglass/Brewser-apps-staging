name: Brewser submissions — deploy

# Fires whenever the plugin's atomic push lands intake/<package-id>/... in the
# staging repo. Each run is idempotent and self-healing: it processes EVERY
# intake/*/submission.json present at checkout, not just paths in the trigger
# commit. A straggler folder left by a previously failed run gets picked up by
# the next run automatically.
#
# All heavy lifting lives in four helper scripts at the repo root under
# scripts/  (validate_manifest.py, safe_unzip.py, upsert_index.py,
# build_callback.py) and the JSON Schema at the repo root
# (manifest.schema.json). See ./README.md for the secrets that must be
# configured on the staging repo before this workflow does anything useful.

on:
  push:
    branches: [ main ]
    paths:
      - 'intake/**'
  workflow_dispatch: {}
  # Large-file intake path. The plugin can't push a big bundle through GitHub's
  # blob API (it 422s ~40 MB), so for oversize apps it fires this dispatch with
  # a tokened URL to fetch the zip. The "Materialize large intake" step below
  # downloads it into intake/<pkg>/ IN THIS RUN, and the normal loop then
  # processes it exactly like a pushed intake (validate → unzip → scan → deploy
  # → callback) — git push handles files the blob API can't. See ./README.md.
  repository_dispatch:
    types: [ large_intake ]

# ONE global concurrency group. Two parallel deploys both fast-forwarding main
# would race; serializing everything is the simplest thing that works, and our
# submission volume is nowhere near where throughput matters.
concurrency:
  group: submissions-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Layout in this repo: helper scripts and the manifest schema live at
      # the repo root (not nested under .github/workflows/).
      SCHEMA_PATH: manifest.schema.json
      SCRIPT_DIR:  scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jsonschema
        run: python -m pip install --quiet 'jsonschema>=4.0'

      # The security scanner is a Node (ESM) tool in scanner/. It runs INLINE in
      # the per-submission loop below (one unpacked tree per submission), so it
      # is invoked like the Python helpers — not as a `uses:` composite action,
      # which cannot run inside a bash loop. Deps are pinned + lockfiled under
      # scanner/. Scan failures never fail intake (see the loop's fail-safe).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: Install scanner deps
        run: npm ci --prefix scanner

      - name: Configure git author
        run: |
          git config user.name  "brewser-submissions-bot"
          git config user.email "brewser-submissions-bot@users.noreply.github.com"

      - name: Sanity-check workflow assets
        run: |
          set -e
          test -f "$SCHEMA_PATH"                     || { echo "missing $SCHEMA_PATH"; exit 1; }
          test -f "$SCRIPT_DIR/validate_manifest.py" || { echo "missing validate_manifest.py"; exit 1; }
          test -f "$SCRIPT_DIR/safe_unzip.py"        || { echo "missing safe_unzip.py"; exit 1; }
          test -f "$SCRIPT_DIR/upsert_index.py"      || { echo "missing upsert_index.py"; exit 1; }
          test -f "$SCRIPT_DIR/build_callback.py"    || { echo "missing build_callback.py"; exit 1; }
          test -f "$SCRIPT_DIR/write_artifact.py"    || { echo "missing write_artifact.py"; exit 1; }

      # Large-file intake: on a repository_dispatch, pull the oversize bundle
      # (which can't go through the plugin's blob API) into intake/<pkg>/ IN THIS
      # run. The normal loop below then processes it identically to a pushed
      # intake. The zip is STAGED (not committed), so the deploy loop's
      # `git rm -rf intake/<pkg>` drops it before the deploy commit — the big
      # blob never enters git history.
      - name: Materialize large intake from dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          CP: ${{ toJSON(github.event.client_payload) }}
          ASSET_TOKEN: ${{ github.event.client_payload.zip_token }}
        run: |
          set -euo pipefail
          get() { printf '%s' "$CP" | python -c "import json,sys; d=json.load(sys.stdin); v=d.get('$1',''); print(v if isinstance(v,str) else '')"; }
          pkg="$(get package_id)"; pkg="$(printf '%s' "$pkg" | tr '[:upper:]' '[:lower:]')"
          ver="$(get version)"; sha="$(get zip_sha256)"; url="$(get zip_url)"
          if [ -z "$pkg" ] || [ -z "$ver" ] || [ -z "$sha" ] || [ -z "$url" ]; then
            echo "::error::large_intake dispatch missing required field(s)"; exit 1
          fi
          # Guard the package id: reverse-DNS shape only, so it can't escape intake/.
          case "$pkg" in
            *[!a-z0-9._-]* | */* | ..* ) echo "::error::illegal package_id '$pkg'"; exit 1 ;;
          esac
          dir="intake/$pkg"
          mkdir -p "$dir"
          # manifest + submission ride inline in the payload (small); write them.
          printf '%s' "$CP" | python -c "import json,sys; d=json.load(sys.stdin); open('$dir/manifest.json','w',encoding='utf-8').write(json.dumps(d['manifest'], separators=(',',':')) if not isinstance(d['manifest'],str) else d['manifest'])"
          printf '%s' "$CP" | python -c "import json,sys; d=json.load(sys.stdin); open('$dir/submission.json','w',encoding='utf-8').write(json.dumps(d['submission'], separators=(',',':')) if not isinstance(d['submission'],str) else d['submission'])"
          # README.md (HTML→Markdown of the Description) rides inline too; write it
          # when present so the deploy loop copies it to the app root exactly like a
          # pushed intake. Older plugins omit it — then no README is written.
          printf '%s' "$CP" | python -c "import json,sys; d=json.load(sys.stdin); r=d.get('readme',''); r=r if isinstance(r,str) else ''; open('$dir/README.md','w',encoding='utf-8').write(r) if r else None"
          # Download with the short-lived token as a HEADER (never in the URL/logs).
          curl -fsSL --retry 3 --retry-delay 2 --max-time 900 \
            -H "X-Brewser-Asset-Token: $ASSET_TOKEN" \
            -o "$dir/bundle.zip" "$url"
          actual="$(sha256sum "$dir/bundle.zip" | awk '{print $1}')"
          if [ "$actual" != "$sha" ]; then
            echo "::error::downloaded bundle sha256 mismatch (got $actual expected $sha)"; exit 1
          fi
          git add "$dir"
          echo "::notice::materialized large intake $pkg@$ver ($(du -h "$dir/bundle.zip" | awk '{print $1}'))"

      - name: Process every pending intake
        env:
          BREWSER_CALLBACK_URL:    ${{ secrets.BREWSER_CALLBACK_URL }}
          BREWSER_CALLBACK_SECRET: ${{ secrets.BREWSER_CALLBACK_SECRET }}
        run: |
          set -uo pipefail

          if [ ! -d intake ]; then
            echo "No intake/ directory — nothing to deploy."
            exit 0
          fi

          mapfile -t submissions < <(find intake -mindepth 2 -maxdepth 2 -name submission.json -print 2>/dev/null | sort)
          if [ "${#submissions[@]}" -eq 0 ]; then
            echo "No pending intake submissions."
            exit 0
          fi

          overall_status=0

          for sub_file in "${submissions[@]}"; do
            intake_dir="$(dirname "$sub_file")"
            pkg="$(basename "$intake_dir")"
            manifest_file="$intake_dir/manifest.json"
            zip_file="$intake_dir/bundle.zip"

            echo "::group::$pkg"
            result="ok"
            error=""
            version=""
            zip_sha256=""
            # Security-scan outputs for THIS submission. Empty on the error path
            # (no unpacked tree to scan); populated after a successful unzip.
            scan_verdict=""
            scan_findings_file=""

            if [ ! -f "$manifest_file" ] || [ ! -f "$zip_file" ]; then
              result="error"
              error="intake is incomplete (missing manifest.json or bundle.zip)"
            else
              zip_sha256=$(python -c "import json; print(json.load(open('$sub_file'))['zip_sha256'])" 2>/dev/null || echo "")
              version=$(python -c "import json; print(json.load(open('$sub_file'))['version'])" 2>/dev/null || echo "")

              if [ -z "$zip_sha256" ] || [ -z "$version" ]; then
                result="error"
                error="submission.json missing zip_sha256 or version"
              fi

              if [ "$result" = "ok" ]; then
                actual_sha=$(sha256sum "$zip_file" | awk '{print $1}')
                if [ "$actual_sha" != "$zip_sha256" ]; then
                  result="error"
                  error="bundle.zip sha256 does not match submission.json"
                fi
              fi

              if [ "$result" = "ok" ]; then
                if ! python "$SCRIPT_DIR/validate_manifest.py" "$manifest_file" "$SCHEMA_PATH" 2> /tmp/schemaerr; then
                  result="error"
                  error="manifest failed schema: $(tr '\n' ' ' </tmp/schemaerr | head -c 500)"
                fi
              fi

              if [ "$result" = "ok" ]; then
                tmpdir="$(mktemp -d)"
                if ! python "$SCRIPT_DIR/safe_unzip.py" "$zip_file" "$tmpdir" 2> /tmp/zerr; then
                  result="error"
                  error="unsafe zip: $(tr '\n' ' ' </tmp/zerr | head -c 500)"
                else
                  target="apps/$pkg"
                  if [ -d "$target" ]; then
                    git rm -rf "$target" >/dev/null
                  fi
                  mkdir -p "$target"
                  # cp -a preserves times but no ownership issues on GH runners.
                  cp -a "$tmpdir"/. "$target"/
                  cp "$manifest_file" "$target/manifest.json"
                  # README.md (generated by the plugin from the submitted, moderated
                  # Description). Copied AFTER the bundle so it overwrites any README
                  # the zip shipped — the app-root copy always reflects the submission.
                  # Older intakes (pre-README) have no file here, so this is a no-op.
                  [ -f "$intake_dir/README.md" ] && cp "$intake_dir/README.md" "$target/README.md"

                  # ---- Artifact inventory (enables on-device install) --------
                  # Per-app file manifest the Brewser runtime downloads to
                  # install a STAGED app on the console (served at
                  # my.brewser.tech/artifacts/<pkg>.json). Same shape as the
                  # prod brewser-apps artifacts (runtime parseArtifacts contract:
                  # {id, sizeBytes, files}). The staging deploy is the only place
                  # the full deployed tree exists to scan. Best-effort: a failure
                  # warns but never fails the deploy — the app still ships, it
                  # just can't be installed on-device until the next good run.
                  mkdir -p artifacts
                  if ! python "$SCRIPT_DIR/write_artifact.py" "$pkg" apps artifacts 2> /tmp/arterr; then
                    echo "::warning::artifact generation for $pkg failed: $(head -c 200 /tmp/arterr 2>/dev/null)"
                  fi

                  # ---- Security scan (informational; NEVER fails intake) -----
                  # Runs on the unpacked tree before the callback so verdict +
                  # findings ride the SAME signed body. scan.mjs always exits 0
                  # and self-degrades to SUSPICIOUS internally; the extra guard
                  # here covers the case where node can't launch at all, so a
                  # broken scanner can't take intake down or auto-clear an app.
                  #
                  # The findings are written to scans/<pkg>.json IN THE REPO and
                  # committed with the deploy, so the scan verdict is recoverable
                  # by the plugin's Re-check action if the callback is ever lost
                  # (e.g. a WAF 403 on the callback). It mirrors how Re-check
                  # already heals STATUS from the deployed apps/<pkg>/manifest.json.
                  mkdir -p scans
                  scan_findings_file="scans/$pkg.json"
                  if node scanner/scan.mjs --package "$tmpdir" --manifest "$manifest_file" --out "$scan_findings_file" 2> /tmp/scanerr; then
                    scan_verdict=$(python -c "import json,sys; print(json.load(open('$scan_findings_file')).get('verdict',''))" 2>/dev/null || echo "")
                  fi
                  if [ -z "$scan_verdict" ]; then
                    scan_verdict="SUSPICIOUS"
                    printf '%s' '{"verdict":"SUSPICIOUS","score":10,"scanner_version":"ci-fallback","scanned_at":"","package_hash":"","counts":{"info":0,"suspicious":1,"dangerous":0},"rationale":"Scanner did not complete in CI — fail-safe verdict, manual review required.","truncated":false,"findings":[{"rule_id":"scan-error","severity":"SUSPICIOUS","title":"Scanner failed in CI","detail":"The scan step produced no verdict; treated as SUSPICIOUS so nothing auto-clears.","file":"","line":0,"evidence":""}],"limitations":"Static heuristic scan. A GOOD verdict is not proof of safety. Human review is still required."}' > "$scan_findings_file"
                    echo "::warning::scan for $pkg did not complete — defaulting verdict to SUSPICIOUS: $(head -c 200 /tmp/scanerr 2>/dev/null)"
                  else
                    echo "::notice::scan for $pkg → $scan_verdict"
                  fi

                  python "$SCRIPT_DIR/upsert_index.py" "$manifest_file" "$sub_file" index.json

                  git rm -rf "$intake_dir" >/dev/null
                  git add -A "$target" "index.json" "$scan_findings_file" artifacts

                  # Capture HEAD BEFORE the commit so a "nothing to commit"
                  # (or any other commit failure) doesn't let deploy_sha
                  # inherit an earlier iteration's SHA and mis-report success.
                  head_before="$(git rev-parse HEAD)"
                  if git commit -m "deploy: ${pkg}@${version}"; then
                    committed_sha="$(git rev-parse HEAD)"
                    if [ "$committed_sha" = "$head_before" ]; then
                      result="error"
                      error="deploy produced no commit (nothing changed?)"
                    fi
                  else
                    result="error"
                    error="git commit failed"
                  fi
                fi
              fi
            fi

            # Callback — one per submission, ok OR error. Skip if the shell
            # secrets aren't configured; log a warning so the operator knows.
            if [ -n "${BREWSER_CALLBACK_URL:-}" ] && [ -n "${BREWSER_CALLBACK_SECRET:-}" ]; then
              deploy_sha=""
              # Only report a deploy SHA when we actually produced a commit
              # in THIS iteration.
              if [ "$result" = "ok" ] && [ -n "${committed_sha:-}" ]; then
                deploy_sha="$committed_sha"
              fi
              cb_dir="$(mktemp -d)"
              # Secret via stdin so it never appears in the process list.
              printf '%s' "$BREWSER_CALLBACK_SECRET" | \
                python "$SCRIPT_DIR/build_callback.py" \
                  --out-dir "$cb_dir" \
                  --scan-verdict "$scan_verdict" \
                  ${scan_findings_file:+--scan-findings-file "$scan_findings_file"} \
                  "$pkg" "$version" "$zip_sha256" "$result" "$deploy_sha" "$error"

              cb_body=$(cat "$cb_dir/body")
              cb_ts=$(cat "$cb_dir/ts")
              cb_sig=$(cat "$cb_dir/sig")

              # --data-raw for JSON: --data strips '@'-prefixed values as
              # file references; --data-raw sends the buffer as-is.
              #
              # curl -sS exits 0 on 4xx/5xx — only a transport error trips
              # its exit code. Capture the HTTP status explicitly so a bad
              # HMAC secret or a WP-side auth failure can't leave a stuck
              # row with zero log breadcrumbs. Every callback outcome now
              # produces exactly one visible line: ::notice:: on 2xx,
              # ::warning:: on non-2xx or transport failure. Callback
              # failure is a warning, not an error — the deploy itself
              # already succeeded and the operator can heal the row via
              # the plugin admin's Re-check action.
              set +e
              http_code=$(curl -sS --max-time 30 \
                -o /tmp/cbresp -w '%{http_code}' \
                -X POST \
                -H "Content-Type: application/json" \
                -H "X-Brewser-Signature: $cb_sig" \
                -H "X-Brewser-Timestamp: $cb_ts" \
                --data-raw "$cb_body" \
                "$BREWSER_CALLBACK_URL")
              curl_exit=$?
              set -u
              if [ "$curl_exit" -ne 0 ]; then
                echo "::warning::callback for $pkg transport failure (curl exit $curl_exit): $(head -c 300 /tmp/cbresp)"
              elif [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                echo "::notice::callback ok for $pkg (HTTP $http_code)"
              else
                echo "::warning::callback for $pkg returned HTTP $http_code: $(head -c 300 /tmp/cbresp)"
              fi
              rm -rf "$cb_dir"
            else
              echo "::warning::BREWSER_CALLBACK_URL / BREWSER_CALLBACK_SECRET not set — skipping callback for $pkg"
            fi

            unset committed_sha

            if [ "$result" != "ok" ]; then
              overall_status=1
              echo "::error::$pkg: $error"
            fi
            echo "::endgroup::"
          done

          # One push at the end — every successful commit rides on it. Do NOT
          # let a network failure or lost race silently mask as a green build.
          if ! git push origin HEAD:main; then
            echo "::error::git push origin HEAD:main failed"
            overall_status=1
          fi

          exit $overall_status
