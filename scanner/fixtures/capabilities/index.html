<!doctype html>
<html>
<head><meta charset="utf-8"><title>Capabilities Demo</title></head>
<body>
<canvas id="c"></canvas>
<script>
  // WebGL + Web Audio inside an INLINE script — exercises the html-analyze →
  // js-analyze capability merge path.
  var gl = document.getElementById('c').getContext('webgl2');
  var ac = new AudioContext();
  var osc = ac.createOscillator();
  osc.connect(ac.destination);
</script>
<script src="app.js"></script>
</body>
</html>
